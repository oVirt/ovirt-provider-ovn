name: Containers

on:
  # Be able to run the job manually when needed
  workflow_dispatch:
  # Build every week on Monday 00:00
  schedule:
    - cron:  '0 0 * * 1'

jobs:
  container:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        container: [ ovirt-provider-ovn, ovn-controller, ovirt-provider-ovn-tests ]
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y podman

      - name: Build container images
        working-directory: automation/containers
        run: make ${{ matrix.container }}

      - name: Push to Quay.io
        env:
          REGISTRY: quay.io
          IMAGE_NAME: ovirt/${{ matrix.container }}
          USERNAME: ${{ secrets.QUAY_USERNAME }}
          PASSWORD: ${{ secrets.QUAY_TOKEN }}
        run: |
          for tag in centos-9 centos-10 almalinux-9 almalinux-10; do
            podman push "${IMAGE_NAME}:${tag}" "${REGISTRY}/${IMAGE_NAME}:${tag}" \
              --tls-verify=true \
              --creds="${USERNAME}:${PASSWORD}"
          done
