name: CI
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
env:
  EXPORT_DIR: exported-artifacts
jobs:
  check:
    runs-on: ubuntu-latest
    container: quay.io/ovirt/ovirt-provider-ovn-tests:${{ matrix.tag }}
    strategy:
      matrix:
        tag: [ centos-9, centos-10, almalinux-9, almalinux-10 ]
    steps:
    - uses: actions/checkout@v7
    - name: Run check
      run: make check

  unit-tests:
    runs-on: ubuntu-latest
    container: quay.io/ovirt/ovirt-provider-ovn-tests:${{ matrix.tag }}
    strategy:
      matrix:
        tag: [ centos-9, centos-10, almalinux-9, almalinux-10 ]
    steps:
      - uses: actions/checkout@v7
      - name: Run unit tests
        run: make unittest

  lint:
    runs-on: ubuntu-latest
    container: quay.io/ovirt/ovirt-provider-ovn-tests:${{ matrix.tag }}
    strategy:
      matrix:
        tag: [ centos-9, centos-10, almalinux-9, almalinux-10 ]
    steps:
      - uses: actions/checkout@v7
      - name: Run lint
        run: make lint

  coverage:
    runs-on: ubuntu-latest
    container: quay.io/ovirt/ovirt-provider-ovn-tests:${{ matrix.tag }}
    strategy:
      matrix:
        tag: [ centos-9, centos-10, almalinux-9, almalinux-10 ]
    steps:
      - uses: actions/checkout@v7
      - name: Run coverage
        run: make coverage

  integration-tests:
    env:
      RUN_INTEG_TESTS: 1
      IMAGE_TAG: ${{ matrix.tag }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tag: [ centos-9, centos-10, almalinux-9, almalinux-10 ]
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install podman tox
      - name: Run integration tests
        run: sudo -E ./automation/create_it_env.sh
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: ovirt-provider-ovn-integ-tests-${{ matrix.tag }}
          path: ${{ env.EXPORT_DIR }}
          retention-days: 5
